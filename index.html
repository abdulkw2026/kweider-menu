<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابط قـويـدر للحلويات الدمشقية | Kweider Sweets</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .ar-font { font-family: Arial, Helvetica, sans-serif; }
        .en-font { font-family: 'Cairo', sans-serif; }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px 15px;
            text-align: center;
            box-sizing: border-box;
        }

        .top-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 12px;
        }

        .profile-img {
            width: 110px; 
            height: 110px;
            border-radius: 50%;
            object-fit: contain;
            background-color: #000;
            margin-bottom: 10px;
            border: 2px solid #C5A059;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.15);
            padding: 3px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .eid-offer {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin: 8px auto 15px auto;
            background-color: transparent;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #C5A059;
            display: inline-block;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 3px;
            color: #cccccc;
            direction: ltr;
        }

        .tagline {
            font-size: 12px;
            color: #C5A059;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* تنسيق الأزرار المتجاورة (الشبكة) */
        .grid-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .link-btn-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 5px;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .link-btn-half i {
            font-size: 18px;
            color: #C5A059;
        }

        .link-btn-half:hover {
            border-color: #C5A059;
            background-color: rgba(197, 160, 89, 0.1);
        }

        /* تنسيق الأزرار الطويلة */
        .link-btn-full {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            border: 1px solid #444;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            position: relative;
        }

        .link-btn-full i {
            position: absolute;
            right: 25px;
            font-size: 18px;
            color: #C5A059;
        }

        .link-btn-full:hover {
            border-color: #C5A059;
            background-color: rgba(197, 160, 89, 0.1);
        }

        .whatsapp-btn {
            border-color: #00b341;
            color: #00b341;
            font-weight: bold;
        }
        .whatsapp-btn i { color: #00b341; }
        .whatsapp-btn:hover {
            border-color: #00e653;
            color: #00e653;
            background-color: rgba(0, 179, 65, 0.1);
        }

        .footer-info {
            margin-top: 15px;
            font-size: 11px;
            color: #777;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.webp" alt="Kweider Logo" class="top-logo">
    <img src="kweider2026.webp" alt="Baklava" class="profile-img">
    
    <div class="brand-title ar-font">قـويـدر للحلويات الدمشقية</div>
    <div class="eid-offer ar-font">🎁 زورونا ...مفاجآت وعروض العيد بانتظاركم 🎁</div>

    <div class="subtitle en-font">Kweider Damascene Sweets</div>
    <div class="tagline en-font">Authentic Damascene Taste Since 1969</div>

    <!-- الصف الأول: إنستغرام و فيسبوك -->
    <div class="grid-row">
        <a href="https://www.instagram.com/kweideruk" class="link-btn-half ar-font" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-instagram"></i> إنستغرام
        </a>
        <a href="https://www.facebook.com/KweiderUK" class="link-btn-half ar-font" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-facebook-f"></i> فيسبوك
        </a>
    </div>

    <!-- الصف الثاني: تيك توك و خريطة جوجل -->
    <div class="grid-row">
        <a href="https://www.tiktok.com/@kweideruk" class="link-btn-half ar-font" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-tiktok"></i> تيك توك
        </a>
        <a href="https://www.google.com/maps/search/?api=1&query=184-186+High+Street,+Acton,+London,+W3+9NH" class="link-btn-half ar-font" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-map-marker-alt"></i> الخريطة
        </a>
    </div>

    <!-- زر الواتساب الطويل -->
    <a href="https://wa.me/447440444500" class="link-btn-full whatsapp-btn ar-font" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-whatsapp"></i> تواصل معنا عبر واتساب
    </a>

    <!-- زر الموقع الإلكتروني الطويل في الأخير -->
    <a href="https://www.kweidersweets.co.uk" class="link-btn-full ar-font" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-globe"></i> تسوق عبر موقعنا الإلكتروني
    </a>

    <div class="footer-info en-font">
        📍 London, 184-186 High Street, Acton, W3 9NH<br>
        🕒 Opening Hours: 11:00 AM - 10:00 PM
    </div>
</div>

</body>
</html>
